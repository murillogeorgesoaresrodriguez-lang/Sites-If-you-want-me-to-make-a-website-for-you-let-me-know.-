<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>
  <style>
    /* Exemplo básico de responsividade */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      background-color: #f5f5f5;
    }
    header {
      width: 100%;
      padding: 20px;
      background-color: #003366;
      color: white;
      text-align: center;
    }
    main {
      width: 90%;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    footer {
      width: 100%;
      padding: 10px;
      background-color: #003366;
      color: white;
      text-align: center;
      position: relative;
      bottom: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>Bem-vindo ao Meu Site!</h1>
</header>

<main>
  <p>Este é um exemplo de site responsivo com tradução automática.</p>
</main>

<footer>
  <p>© 2025 Meu Site</p>
</footer>

<script>
  // Detecta o idioma do navegador
  const userLang = navigator.language || navigator.userLanguage;

  // Define o idioma padrão do site
  const defaultLang = "pt"; // português

  // Se o idioma for diferente do padrão, traduz automaticamente via Google Translate
  if (!userLang.startsWith(defaultLang)) {
    const translateUrl = "https://translate.google.com/translate?hl=&sl=pt&tl=" + userLang + "&u=" + encodeURIComponent(window.location.href);
    window.location.href = translateUrl;
  }
</script>

</body>
</html>
