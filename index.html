<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>História do Cachorro Nerd</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(160deg, #0f172a, #1e293b);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      color: #60a5fa;
      margin-bottom: 10px;
      text-shadow: 1px 1px 4px #000;
    }

    main {
      max-width: 800px;
      width: 100%;
      background: #020617;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      text-align: justify;
    }

    footer {
      margin-top: auto;
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .credits {
      font-weight: bold;
    }

    .copyright {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>

<header>
  <h1 id="title"></h1>
</header>

<main>
  <img src="https://i.imgur.com/Qv7UhQa.jpeg" alt="Cachorro Nerd">
  <p id="story"></p>
  <p id="ending"></p>
</main>

<footer>
  <div class="credits" id="footer"></div>
  <div class="copyright">
    <span>&copy;</span>
    <span>Google</span>
    <span>NeverBad667</span>
  </div>
</footer>

<script>
/* =========================
   HISTÓRIA TRADUZIDA AUTOMÁTICA
   ========================= */

const translations = {
  pt: {
    title: "A História do Cachorro Nerd",
    story: `Em uma pequena cidade, vivia um cachorro chamado Tico, conhecido por seu incrível intelecto. 🐶💻
Tico não gostava de brincar como os outros cães; em vez disso, passava horas estudando livros de ciência, 
resolvendo enigmas e até programando pequenos robôs que o ajudavam a organizar seus ossos e brinquedos. 
Com óculos sempre bem ajustados, ele se aventurava em laboratórios improvisados, criando invenções que ninguém jamais imaginou. 
Apesar de sua mente brilhante, Tico tinha um coração enorme, sempre ajudando outros cães e humanos com suas descobertas.`,
    ending: "E assim, Tico, o cachorro nerd, se tornou uma lenda na cidade, provando que inteligência e bondade andam sempre lado a lado.",
    footer: "2025 • Site criado por NeverBad667"
  },
  en: {
    title: "The Story of the Nerdy Dog",
    story: `In a small town lived a dog named Tico, famous for his incredible intellect. 🐶💻
Tico didn't like playing like other dogs; instead, he spent hours studying science books, solving puzzles, 
and even programming small robots to help him organize his bones and toys. 
With perfectly adjusted glasses, he ventured into improvised labs, creating inventions no one had ever imagined. 
Despite his brilliant mind, Tico had a huge heart, always helping other dogs and humans with his discoveries.`,
    ending: "And so, Tico, the nerdy dog, became a legend in the town, proving that intelligence and kindness always go hand in hand.",
    footer: "2025 • Website created by NeverBad667"
  },
  es: {
    title: "La Historia del Perro Nerd",
    story: `En un pequeño pueblo vivía un perro llamado Tico, famoso por su increíble intelecto. 🐶💻
A Tico no le gustaba jugar como los demás perros; en cambio, pasaba horas estudiando libros de ciencia, resolviendo enigmas, 
e incluso programando pequeños robots que lo ayudaban a organizar sus huesos y juguetes. 
Con gafas siempre bien ajustadas, se aventuraba en laboratorios improvisados, creando inventos que nadie había imaginado. 
A pesar de su brillante mente, Tico tenía un gran corazón, siempre ayudando a otros perros y humanos con sus descubrimientos.`,
    ending: "Y así, Tico, el perro nerd, se convirtió en una leyenda en el pueblo, demostrando que la inteligencia y la bondad siempre van de la mano.",
    footer: "2025 • Sitio web creado por NeverBad667"
  }
};

/* =========================
   DETECÇÃO DE IDIOMA
   ========================= */

function getUserLanguage() {
  const lang = navigator.language || navigator.userLanguage;
  if (!lang) return "pt";
  if (lang.startsWith("en")) return "en";
  if (lang.startsWith("es")) return "es";
  return "pt";
}

/* =========================
   APLICAR TRADUÇÃO
   ========================= */

const userLang = getUserLanguage();
const text = translations[userLang];

document.getElementById("title").innerText = text.title;
document.getElementById("story").innerText = text.story;
document.getElementById("ending").innerText = text.ending;
document.getElementById("footer").innerText = text.footer;

</script>

</body>
</html>
