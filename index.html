<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-top: 20px;
    }

    h1 {
      color: #60a5fa;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
    }

    main {
      max-width: 700px;
      width: 100%;
      background: #020617;
      border-radius: 14px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    img {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      margin: 20px auto;
      display: block;
    }

    footer {
      margin-top: auto;
      padding: 16px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<header>
  <h1 id="title"></h1>
</header>

<main>
  <p id="description"></p>

  <!-- TROQUE O LINK PELA SUA IMAGEM (RAW / IMGUR DIRETO) -->
  <img src="https://i.imgur.com/8QZQZQZ.png" alt="Imagem do site">

  <p id="info"></p>
</main>

<footer id="footer"></footer>

<script>
/* =========================
   TRADUÇÕES DO SITE
   ========================= */

const translations = {
  pt: {
    title: "Bem-vindo ao meu site 🌐",
    description: "Este site muda automaticamente de idioma dependendo de quem acessa.",
    info: "Se você estiver vendo isso em outra língua, a tradução foi feita automaticamente.",
    footer: "Site criado por Murilex 🚀"
  },
  en: {
    title: "Welcome to my website 🌐",
    description: "This website automatically changes language depending on the visitor.",
    info: "If you are seeing this in another language, it was translated automatically.",
    footer: "Website created by Murilex 🚀"
  },
  es: {
    title: "Bienvenido a mi sitio web 🌐",
    description: "Este sitio cambia de idioma automáticamente según quien lo visite.",
    info: "Si estás viendo esto en otro idioma, fue traducido automáticamente.",
    footer: "Sitio web creado por Murilex 🚀"
  }
};

/* =========================
   DETECÇÃO DE IDIOMA
   ========================= */

function getUserLanguage() {
  const lang = navigator.language || navigator.userLanguage;
  if (!lang) return "pt";
  if (lang.startsWith("en")) return "en";
  if (lang.startsWith("es")) return "es";
  return "pt";
}

/* =========================
   APLICAR TRADUÇÃO
   ========================= */

const userLang = getUserLanguage();
const text = translations[userLang];

document.getElementById("title").innerText = text.title;
document.getElementById("description").innerText = text.description;
document.getElementById("info").innerText = text.info;
document.getElementById("footer").innerText = text.footer;
</script>

</body>
</html>
